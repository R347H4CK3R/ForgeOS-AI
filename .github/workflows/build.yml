name: Build ForgeOS AI Android APK
on:
  push:
    branches: [main, 'forgeos/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forgeos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Bridge tests
        run: python -m unittest discover -s bridge -v
      - name: SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test lint and build
        working-directory: android
        run: gradle --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ForgeOS-native-review
          path: |
            android/app/build/outputs/apk/debug/
            android/app/build/reports/
          if-no-files-found: error

  native-ui:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_c
          ram-size: 2048M
          disable-animations: true
          script: |
            cd android
            gradle --no-daemon --max-workers=2 connectedDebugAndroidTest
            mkdir -p ../preview
            adb pull /sdcard/Android/data/dev.forgeos.ai/files/review ../preview/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ForgeOS-native-UI-review
          path: |
            preview/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: error
