name: Build ForgeOS AI Android APK
on:
  push:
    branches: [main, 'forgeos/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forgeos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 8bed7cfb999cebc03d2cc5b78911026a8d57549a
          path: android/app/src/main/cpp/llama.cpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Bridge tests
        run: python -m unittest discover -s bridge -v
      - name: SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Test lint and build
        working-directory: android
        run: gradle --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ForgeOS-native-review
          path: |
            android/app/build/outputs/apk/debug/
            android/app/build/reports/
          if-no-files-found: error

  native-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 8bed7cfb999cebc03d2cc5b78911026a8d57549a
          path: android/app/src/main/cpp/llama.cpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download pinned 135M model for isolated inference test
        run: |
          curl --fail --location --retry 2 --max-time 180 -o test-model.gguf https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/09816acd5d99df7be770d85ea30822623dab342c/SmolLM2-135M-Instruct-Q4_K_M.gguf
          echo "2e8040ceae7815abe0dcb3540b9995eaa1fa0d2ca9e797d0a635ae4433c68c2d  test-model.gguf" | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_c
          ram-size: 2048M
          disable-animations: true
          script: |
            cd android
            gradle --no-daemon --max-workers=2 -PforgeAbi=x86_64 assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell run-as dev.forgeos.ai mkdir -p files
            adb exec-in run-as dev.forgeos.ai tee files/test-model.gguf < ../test-model.gguf > /dev/null
            gradle --no-daemon --max-workers=2 -PforgeAbi=x86_64 connectedDebugAndroidTest
            mkdir -p ../preview
            adb pull /sdcard/Android/data/dev.forgeos.ai/files/review ../preview/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ForgeOS-native-UI-review
          path: |
            preview/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: error
