name: Build ForgeOS AI Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'bridge/**', '.github/workflows/build.yml', '.github/scripts/**', '.github/actions/**', 'os/image/sign_apk.py', 'os/image/image_tools.py', 'os/image/forgeos-apk-signing-cert.pem']
  pull_request:
    paths: ['android/**', 'bridge/**', '.github/workflows/build.yml', '.github/scripts/**', '.github/actions/**', 'os/image/sign_apk.py', 'os/image/image_tools.py', 'os/image/forgeos-apk-signing-cert.pem']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: forgeos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.scope.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check source-scope regression tests
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Compare against last successful branch source
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: python .github/scripts/app_scope.py
  build:
    permissions:
      contents: write
    needs: scope
    if: needs.scope.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 8bed7cfb999cebc03d2cc5b78911026a8d57549a
          path: android/app/src/main/cpp/llama.cpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: forgeos-native-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: forgeos-native-${{ runner.os }}-${{ github.job }}-
      - name: Enable bounded native compiler cache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ccache
          ccache --max-size=512M
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Bridge tests
        run: python -m unittest discover -s bridge -v
      - name: SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Test lint and build
        working-directory: android
        run: gradle --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - name: Sign review APK with stable owner identity
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          FORGEOS_APK_SIGNING_KEY: ${{ secrets.FORGEOS_APK_SIGNING_KEY }}
        run: |
          python os/image/sign_apk.py --input android/app/build/outputs/apk/debug/app-debug.apk --output android/app/build/outputs/apk/debug/ForgeOS-signed.apk --certificate os/image/forgeos-apk-signing-cert.pem --expected-cert-sha256 4e17359b376fc57b4d39c4479c23e8c786d93b621ac33d7eaed3114287914c9a --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" --evidence android/app/build/outputs/apk/debug/signing-evidence.json --source "$GITHUB_SHA"
      - uses: ./.github/actions/publish-review
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: ForgeOS-native-review
          paths: |
            android/app/build/outputs/apk/debug/
            android/app/build/reports/

  native-ui:
    permissions:
      contents: write
    needs: scope
    if: needs.scope.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 8bed7cfb999cebc03d2cc5b78911026a8d57549a
          path: android/app/src/main/cpp/llama.cpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: forgeos-native-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: forgeos-native-${{ runner.os }}-${{ github.job }}-
      - name: Enable bounded native compiler cache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ccache
          ccache --max-size=512M
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download pinned 135M model for isolated inference test
        run: |
          curl --fail --location --retry 2 --max-time 180 -o test-model.gguf https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/09816acd5d99df7be770d85ea30822623dab342c/SmolLM2-135M-Instruct-Q4_K_M.gguf
          echo "2e8040ceae7815abe0dcb3540b9995eaa1fa0d2ca9e797d0a635ae4433c68c2d  test-model.gguf" | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_c
          ram-size: 3072M
          disable-animations: true
          script: bash .github/scripts/ui-review.sh
      - uses: ./.github/actions/publish-review
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: ForgeOS-native-UI-review
          paths: |
            preview/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/

  live-agent:
    permissions:
      contents: write
    needs: scope
    if: needs.scope.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: ${{ github.workspace }}/.forge-models
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_KEEP_ALIVE: '0'
      CUDA_VISIBLE_DEVICES: '-1'
      FORGEOS_LIVE_MODEL: qwen2.5-coder:1.5b
      FORGEOS_EVIDENCE_FILE: agent-evidence.json
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned model backend on isolated worker
        run: |
          curl --fail --location --retry 2 --max-time 300 -o ollama.tar.zst https://github.com/ollama/ollama/releases/download/v0.40.14/ollama-linux-amd64.tar.zst
          echo "993e83d08c3d13d17c55009a3e2664c8a25445e644aec3a68bef5abb6abce67d  ollama.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/forge-ollama"
          tar --zstd -xf ollama.tar.zst -C "$RUNNER_TEMP/forge-ollama"
          echo "$RUNNER_TEMP/forge-ollama/bin" >> "$GITHUB_PATH"
      - name: Start loopback backend
        run: |
          ollama serve > ollama.log 2>&1 &
          python - <<'PY'
          import json,time,urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:11434/api/version",timeout=1) as response:
                      assert json.load(response)["version"]=="0.40.14"
                  break
              except Exception:
                  if attempt==29:raise
                  time.sleep(1)
          PY
      - name: Pull small free model
        run: ollama pull "$FORGEOS_LIVE_MODEL"
      - name: Verify real tool-calling and approval boundaries
        run: python -m unittest discover -s bridge -p test_agent_live.py -v
      - uses: ./.github/actions/publish-review
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: ForgeOS-live-agent-evidence
          paths: |
            agent-evidence.json
            ollama.log
