name: Build ForgeOS AI Android APK
on:
  push:
    branches: [main, 'forgeos/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forgeos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test lint and build
        working-directory: android
        run: gradle --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ForgeOS-native-review
          path: |
            android/app/build/outputs/apk/debug/
            android/app/build/reports/
          if-no-files-found: error
